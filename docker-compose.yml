# Two databases with two different jobs:
#   mysql    = the "business" database (Sakila DVD-rental data) that questions are answered FROM
#   pgvector = the vector DB that stores the knowledge base (PDF text, diagram descriptions, schema cards)
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 20

  mysql:
    image: sakiladb/mysql:8        # community image with Sakila schema + data pre-loaded
    ports: ["3307:3306"]           # 3307 on the host so it never clashes with a local MySQL
    # user: sakila / password: p_ssW0rd / database: sakila   (see .env.example)
    # Prefer the official files? use docker-compose.official-mysql.yml (see README)

  ollama:                          # optional, 100% free local models:  docker compose --profile ollama up -d
    image: ollama/ollama
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  pgdata:
  ollama:
