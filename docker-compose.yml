services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 20

  mysql:
    image: sakiladb/mysql:8
    ports: ["3307:3306"]

  adminer:
    image: adminer
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: pgvector
    depends_on: [pgvector, mysql]

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    environment:
      OLLAMA_CONTEXT_LENGTH: "16384"
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  pgdata:
  ollama:
