# Fallback: official MySQL image + Oracle's Sakila files.
#   1) bash scripts/fetch_sakila.sh          (downloads into ./sakila-db)
#   2) docker compose -f docker-compose.yml -f docker-compose.official-mysql.yml up -d
#   3) in .env set MYSQL_USER=root and MYSQL_PASSWORD=root
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./sakila-db:/docker-entrypoint-initdb.d:ro
